[project]
name = "codex-desktop-harness"
version = "0.1.0"
description = "Local Ollama controller and MCP adapter spike for Codex Desktop"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
desktop-harness = "desktop_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_harness"]
